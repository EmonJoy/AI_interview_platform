<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Greeting Card</title>
    <style>
        /* Base Light Theme Variables */
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        /* Automatic Dark Theme Media Query */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border-color: #334155;
            }
        }

        /* Layout Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Static Minimal Card */
        .card {
            background-color: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        /* Static Elements */
        .emoji {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        .greeting {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .subtext {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-muted);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="emoji">👋</span>
        <h1 class="greeting">Hello, Visitor!</h1>
        <p class="subtext">Welcome to your workspace.</p>
    </div>
</body>
</html>
