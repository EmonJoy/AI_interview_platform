<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Greeting</title>
    <style>
        /* Base Light Theme Variables */
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #6c5ce7;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        /* Automatic Dark Theme Media Query */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-color: #f8fafc;
                --accent-color: #a855f7;
                --shadow-color: rgba(0, 0, 0, 0.4);
            }
        }

        /* Layout Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s ease;
            overflow: hidden;
        }

        /* Animated Card */
        .card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px var(--shadow-color);
            text-align: center;
            transition: transform 0.3s ease, background-color 0.5s ease;
            animation: slideUp FadeIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Animated Greeting Text */
        .greeting {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-color);
            margin-bottom: 0.5rem;
            animation: pulse 2s infinite ease-in-out;
        }

        /* Subtext with Gradient */
        .subtext {
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(45deg, var(--accent-color), #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        /* Animated Emoji */
        .wave-emoji {
            display: inline-block;
            font-size: 2.5rem;
            animation: wave 1.5s infinite ease-in-out;
            transform-origin: 70% 70%;
        }

        /* --- Keyframe Animations --- */
        @keyframes slideUpFadeIn {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-15deg); }
            40% { transform: rotate(10deg); }
            60% { transform: rotate(-10deg); }
            80% { transform: rotate(5deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="wave-emoji">👋</div>
        <h1 class="greeting">Hello, Visitor!</h1>
        <p class="subtext">Welcome to your beautiful workspace.</p>
    </div>

</body>
</html>
